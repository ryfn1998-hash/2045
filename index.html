<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ FR科技公司 - 旗艦 AI 生產器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .glass-morphism { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        #preview-container iframe { width: 100%; height: 400px; border: none; background: white; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 pb-10">

    <div class="max-w-4xl mx-auto py-6 px-4">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-blue-600">⚡ FR TECHNOLOGY</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-[0.2em]">Professional AI Engine</p>
            </div>
            <div class="px-3 py-1 bg-green-100 text-green-600 text-xs rounded-full font-bold">● SYSTEM ONLINE</div>
        </header>

        <div class="glass-morphism rounded-3xl shadow-2xl p-6 mb-6 border border-white">
            <div class="grid grid-cols-1 gap-4">
                
                <div class="flex flex-col sm:flex-row gap-2">
                    <select id="typeSelect" class="bg-white border border-slate-200 p-3 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold text-sm">
                        <option value="HTML 網頁 (含 Tailwind)">🌐 網頁程式</option>
                        <option value="Python Script">🐍 Python 腳本</option>
                        <option value="Arduino C++">🤖 Arduino 控制</option>
                        <option value="SQL Query">🗄️ SQL 資料庫</option>
                    </select>
                    <input type="text" id="userInput" placeholder="輸入需求，例如：做一個透明質感的登入表單..." 
                           class="flex-1 bg-white border border-slate-200 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 shadow-inner">
                </div>

                <button onclick="generate()" id="sendBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-200 text-lg">
                    立即生成程式碼
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            
            <div class="bg-[#0f172a] rounded-3xl shadow-2xl overflow-hidden border border-slate-800">
                <div class="flex items-center justify-between px-6 py-4 bg-[#1e293b]/50">
                    <div class="flex gap-1.5">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    </div>
                    <span id="statusLabel" class="text-slate-500 text-[10px] font-mono tracking-widest uppercase">Console Ready</span>
                    <button onclick="copyCode()" class="text-[10px] bg-blue-600/20 hover:bg-blue-600 text-blue-400 py-1 px-4 rounded-full transition-colors font-bold uppercase">Copy</button>
                </div>
                <pre class="p-8 text-blue-300 font-mono text-sm overflow-x-auto min-h-[300px] whitespace-pre-wrap leading-relaxed" id="codeOutput">// FR AI 核心準備就緒，請輸入指令...</pre>
            </div>

            <div id="preview-section" class="hidden">
                <h3 class="text-sm font-bold text-slate-500 mb-2 ml-2 uppercase tracking-widest">Live Preview 實時預覽</h3>
                <div id="preview-container" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                    <iframe id="preview-frame"></iframe>
                </div>
            </div>

        </div>

        <footer class="mt-10 text-center">
            <p class="text-slate-400 text-[10px] tracking-[0.3em] uppercase">© 2024 FR Technology Corp. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        const API_KEY = 'AIzaSyC4iEfkszutbCm6ufE6nRYPFcPMPV-B6yE';

        async function generate() {
            const type = document.getElementById('typeSelect').value;
            const input = document.getElementById('userInput').value;
            const output = document.getElementById('codeOutput');
            const status = document.getElementById('statusLabel');
            const btn = document.getElementById('sendBtn');
            const previewSection = document.getElementById('preview-section');

            if (!input) return alert("請輸入指令！");

            status.innerText = "AI Processing...";
            btn.disabled = true;
            btn.innerText = "FR AI 正在撰寫中...";
            output.innerText = "// 正在連接 FR 科技公司加密伺服器...\n// 正在分析指令並生成優化代碼...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `請根據以下格式生成程式碼：\n類型：${type}\n需求：${input}\n\n注意：如果類型是網頁，請務必提供完整的 HTML (包含 Tailwind CSS CDN)。請只輸出程式碼，不要有任何開頭介紹或結尾說詞。` }]
                        }]
                    })
                });

                const data = await response.json();
                let result = data.candidates[0].content.parts[0].text;
                
                // 清理 Markdown 標記
                result = result.replace(/```[a-z]*\n/g, '').replace(/```/g, '').trim();
                
                output.innerText = result;
                status.innerText = "Execution Success";

                // 如果是網頁格式，顯示預覽
                if (type.includes("HTML")) {
                    previewSection.classList.remove('hidden');
                    const frame = document.getElementById('preview-frame');
                    frame.srcdoc = result;
                } else {
                    previewSection.classList.add('hidden');
                }

            } catch (error) {
                output.innerText = "// 發生連線錯誤，請檢查您的網路或 API 配額。";
                status.innerText = "System Error";
            } finally {
                btn.disabled = false;
                btn.innerText = "立即生成程式碼";
            }
        }

        function copyCode() {
            const text = document.getElementById('codeOutput').innerText;
            navigator.clipboard.writeText(text);
            alert("✅ 程式碼已複製至剪貼簿！");
        }
    </script>
</body>
</html>
