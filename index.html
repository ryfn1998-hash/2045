<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ FR科技公司 - 專業級 AI 程式碼生產器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .loading { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-[#f1f5f9] min-h-screen">

    <div class="max-w-4xl mx-auto pt-4 px-4 pb-10">
        <header class="mb-4 flex flex-col items-center">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter">⚡ FR 科技公司</h1>
            <div class="h-1 w-8 bg-blue-600 rounded-full mt-1"></div>
        </header>

        <div class="bg-white rounded-[2rem] shadow-xl p-5 mb-4 border border-slate-200">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Format / 格式</label>
                    <select id="typeSelect" class="w-full mt-1 bg-slate-50 border border-slate-200 p-3 rounded-xl font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="HTML Webpage with Tailwind CSS">🌐 網頁程式</option>
                        <option value="Python Script">🐍 Python 程式</option>
                        <option value="Arduino C++">🤖 Arduino 控制</option>
                        <option value="SQL Query">🗄️ SQL 指令</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Instruction / 指令</label>
                    <div class="flex flex-col gap-2">
                        <input type="text" id="userInput" placeholder="輸入需求 (例如：漸層文字)" 
                               class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 shadow-inner">
                        <button onclick="runFR_Engine()" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-200">
                            發送指令
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-[#0f172a] rounded-[2rem] shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between px-6 py-3 bg-[#1e293b]">
                <div class="flex gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                </div>
                <div id="statusLabel" class="text-slate-500 text-[10px] font-mono tracking-widest uppercase">FR-Engine v1.5</div>
                <button onclick="copyCode()" class="text-[10px] text-blue-400 font-bold uppercase">Copy</button>
            </div>
            <div class="p-6 min-h-[300px]">
                <code id="codeOutput" class="code-font text-blue-100 text-sm leading-relaxed block whitespace-pre-wrap">// 等待指令中...</code>
            </div>
        </div>

        <div id="previewBox" class="hidden mt-4">
            <p class="text-[10px] font-bold text-slate-400 mb-2 ml-2 uppercase">Live Preview</p>
            <div class="bg-white rounded-[2rem] shadow-lg overflow-hidden border border-slate-200">
                <iframe id="previewFrame" class="w-full h-64 border-none"></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyC4iEfkszutbCm6ufE6nRYPFcPMPV-B6yE';

        async function runFR_Engine() {
            const type = document.getElementById('typeSelect').value;
            const input = document.getElementById('userInput').value;
            const output = document.getElementById('codeOutput');
            const status = document.getElementById('statusLabel');
            const btn = document.getElementById('sendBtn');
            const previewBox = document.getElementById('previewBox');

            if (!input) return alert("請輸入指令");

            // UI 狀態切換
            btn.disabled = true;
            btn.classList.add('loading');
            btn.innerText = "FR AI 撰寫中...";
            status.innerText = "CONNECTING...";
            output.innerText = "// 正在連線至 FR 科技核心伺服器...";
            previewBox.classList.add('hidden');

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `你是一位全能工程師，請直接給予程式碼，不要廢話。類型：${type}，需求：${input}` }] }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error.message || "未知錯誤");
                }

                const data = await response.json();
                let code = data.candidates[0].content.parts[0].text;
                
                // 移除 Markdown
                code = code.replace(/```[a-z]*\n/g, '').replace(/```/g, '').trim();

                output.innerText = code;
                status.innerText = "SUCCESS";
                
                if (type.includes("HTML")) {
                    previewBox.classList.remove('hidden');
                    document.getElementById('previewFrame').srcdoc = code;
                }

            } catch (err) {
                console.error(err);
                output.innerText = "⚠️ 錯誤報告：\n" + err.message + "\n\n[排錯建議]\n1. 請確認手機網路是否通暢。\n2. 如果是本地存檔打開，請嘗試上傳至 GitHub Pages。";
                status.innerText = "FAILED";
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.innerText = "發送指令";
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('codeOutput').innerText);
            alert("已複製！");
        }
    </script>
</body>
</html>
