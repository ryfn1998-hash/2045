<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ FR科技公司 - 專業級 AI 程式碼生產器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        
        /* 處理手機端長按與溢出 */
        pre { word-wrap: break-word; white-space: pre-wrap; }
        
        /* 酷炫動畫 */
        @keyframes pulse-blue {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading-pulse { animation: pulse-blue 1.5s infinite; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen pb-12">

    <div class="max-w-4xl mx-auto pt-8 px-4">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">⚡ FR 科技公司</h1>
            <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em] mt-1">AI Code Generation System</p>
        </header>

        <div class="bg-white rounded-[2rem] shadow-2xl p-5 md:p-8 mb-6 border border-slate-100">
            <div class="flex flex-col gap-5">
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-widest">Select Format 格式選擇</label>
                    <select id="typeSelect" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold text-slate-700 appearance-none cursor-pointer">
                        <option value="HTML/Tailwind CSS Web">🌐 網頁程式 (HTML/Tailwind)</option>
                        <option value="Python Script">🐍 Python 程式碼</option>
                        <option value="Arduino C++ Code">🤖 Arduino 硬體控制</option>
                        <option value="SQL Query Language">🗄️ SQL 資料庫語法</option>
                        <option value="Standard JSON">📄 JSON 資料格式</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-widest">Instructions 指令需求</label>
                    <div class="flex flex-col gap-3">
                        <textarea id="userInput" rows="3" placeholder="請描述您想寫的程式... (例如：做一個發光的按鈕)" 
                                  class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl outline-none focus:border-blue-500 transition-all resize-none shadow-inner"></textarea>
                        
                        <button onclick="startFR_AI()" id="sendBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl transition-all active:scale-[0.98] shadow-xl shadow-blue-200 text-lg flex items-center justify-center gap-2">
                            <span>發送指令</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-[#0f172a] rounded-[2rem] shadow-2xl overflow-hidden border border-slate-800">
            <div class="flex items-center justify-between px-6 py-4 bg-[#1e293b]">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
                </div>
                <div id="statusLabel" class="text-slate-500 text-[10px] font-bold tracking-tighter uppercase">FR-Core V1.5 Ready</div>
                <button onclick="copyCode()" class="text-xs font-bold text-blue-400 hover:text-blue-300 transition-colors uppercase">Copy</button>
            </div>
            
            <div class="p-6 md:p-8 min-h-[400px]">
                <code id="codeOutput" class="code-font text-blue-100 text-sm leading-relaxed block whitespace-pre-wrap">// 這裡將顯示生成的程式碼...</code>
            </div>
        </div>

        <div id="previewSection" class="hidden mt-6">
            <div class="flex items-center gap-2 mb-3 ml-2 text-slate-500">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
                <span class="text-xs font-bold uppercase tracking-widest">Live Preview 實時預覽</span>
            </div>
            <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-slate-200">
                <iframe id="previewFrame" class="w-full h-[400px] border-none"></iframe>
            </div>
        </div>
        
        <footer class="mt-12 text-center">
            <div class="h-[1px] w-12 bg-slate-300 mx-auto mb-4"></div>
            <p class="text-slate-400 text-[9px] tracking-[0.4em] uppercase font-bold">© FR Technology Group | Exclusive Edition</p>
        </footer>
    </div>

    <script>
        // FR 科技公司專用金鑰
        const FR_CORE_KEY = 'AIzaSyC4iEfkszutbCm6ufE6nRYPFcPMPV-B6yE';

        async function startFR_AI() {
            const type = document.getElementById('typeSelect').value;
            const input = document.getElementById('userInput').value;
            const output = document.getElementById('codeOutput');
            const status = document.getElementById('statusLabel');
            const btn = document.getElementById('sendBtn');
            const previewSection = document.getElementById('previewSection');
            const previewFrame = document.getElementById('previewFrame');

            if (!input.trim()) {
                alert("請輸入指令後再發送！");
                return;
            }

            // 初始化狀態
            btn.disabled = true;
            btn.innerHTML = `<span class="loading-pulse">處理中...</span>`;
            status.innerText = "Connecting to FR-Core...";
            status.classList.add('text-blue-400');
            output.innerText = "// 正在調用 FR 科技公司 AI 核心...\n// 正在根據需求撰寫 " + type + " 程式碼...";
            previewSection.classList.add('hidden');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${FR_CORE_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `你是一位全能程式開發專家。請直接產出程式碼，不要廢話，不要解釋。類型：${type}。指令需求：${input}。` }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let finalCode = data.candidates[0].content.parts[0].text;
                    
                    // 去除 Markdown 格式符號
                    finalCode = finalCode.replace(/```[a-z]*\n/g, '').replace(/```/g, '').trim();
                    
                    output.innerText = finalCode;
                    status.innerText = "Success - FR System Executed";
                    
                    // 如果是網頁格式，啟動預覽
                    if (type.includes("HTML")) {
                        previewSection.classList.remove('hidden');
                        previewFrame.srcdoc = finalCode;
                    }
                } else {
                    throw new Error("API 回傳格式異常");
                }

            } catch (error) {
                console.error(error);
                output.innerText = "// 偵測到連線異常。\n// 原因：可能是網路環境不穩定或 API 暫時繁忙。\n// 建議：請稍後再試一次。";
                status.innerText = "Core Connection Failed";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>發送指令</span><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>`;
            }
        }

        function copyCode() {
            const text = document.getElementById('codeOutput').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("FR 程式碼已成功複製！");
            });
        }
    </script>
</body>
</html>
