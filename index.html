<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ FR 科技公司 - AI 程式碼快速生產器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        pre { white-space: pre-wrap; word-wrap: break-word; }
        .btn-loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-black text-gray-800">⚡ FR 科技公司</h1>
            <p class="text-gray-400 text-[10px] tracking-[0.3em] font-bold uppercase mt-2">AI 程式碼快速生產器</p>
        </header>

        <div class="bg-white rounded-3xl shadow-xl p-6 mb-6 border border-gray-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="col-span-1">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 ml-1">程式格式/類型</label>
                    <select id="typeSelect" class="w-full border-gray-200 border-2 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 font-bold">
                        <option value="HTML網頁程式">🌐 網頁程式</option>
                        <option value="Python程式碼">🐍 Python 腳本</option>
                        <option value="Arduino控制碼">🤖 Arduino 控制</option>
                        <option value="SQL資料庫格式">🗄️ SQL 指令</option>
                    </select>
                </div>
                <div class="col-span-1 md:col-span-3">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 ml-1">您的需求指令</label>
                    <div class="flex flex-col md:flex-row gap-2">
                        <input type="text" id="userInput" placeholder="輸入需求 (例如：做一個發光的按鈕)" 
                               class="flex-grow border-gray-200 border-2 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none shadow-inner">
                        <button onclick="frPowerOn()" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-black px-10 py-3 rounded-xl transition-all shadow-lg">
                            發送
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-[#1e2227] rounded-3xl shadow-2xl overflow-hidden border border-gray-800">
            <div class="flex items-center justify-between px-6 py-4 bg-[#282c34]">
                <div class="flex gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                </div>
                <span class="text-gray-500 text-[10px] font-mono font-bold uppercase tracking-widest" id="statusLabel">SYSTEM READY</span>
                <button onclick="copyCode()" class="text-[10px] font-bold text-blue-400 uppercase">複製</button>
            </div>
            <div class="p-6 min-h-[400px]">
                <pre id="codeOutput" class="text-green-400 font-mono text-sm leading-relaxed">// 這裡將顯示 FR AI 的生成結果...</pre>
            </div>
        </div>
    </div>

    <script>
        // 你的金鑰
        const THE_KEY = 'AIzaSyC4iEfkszutbCm6ufE6nRYPFcPMPV-B6yE';

        async function frPowerOn() {
            const type = document.getElementById('typeSelect').value;
            const input = document.getElementById('userInput').value;
            const output = document.getElementById('codeOutput');
            const status = document.getElementById('statusLabel');
            const btn = document.getElementById('sendBtn');

            if (!input.trim()) return alert("請輸入指令！");

            // 狀態設定
            btn.classList.add('btn-loading');
            btn.innerText = "生成中...";
            status.innerText = "CONNECTING FR-CORE...";
            output.innerText = "/* 正在連線中，請稍候... */";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${THE_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `你是一位資深工程師。請直接產出程式碼，類型：${type}，需求：${input}` }] }]
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`連線失敗 (代碼: ${response.status})`);
                }

                const data = await response.json();
                let code = data.candidates[0].content.parts[0].text;
                
                // 去除 Markdown
                code = code.replace(/```[a-z]*\n/g, '').replace(/```/g, '').trim();

                output.innerText = code;
                status.innerText = "SUCCESS";

            } catch (err) {
                output.innerText = `/* FR 系統報告：生成失敗 */\n\n錯誤原因：${err.message}\n\n建議：請檢查手機網路，或嘗試重新整理頁面再試一次。`;
                status.innerText = "SYSTEM ERROR";
            } finally {
                btn.classList.remove('btn-loading');
                btn.innerText = "發送";
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('codeOutput').innerText);
            alert("已複製！");
        }
    </script>
</body>
</html>
