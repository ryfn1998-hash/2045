<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2045 數據節點 | 未來網站</title>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --bg-dark: #0a0a12;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 2045 動態背景矩陣 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            max-width: 600px;
            position: relative;
            z-index: 5;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px var(--neon-cyan));
        }

        .status-tag {
            font-size: 0.8rem;
            border: 1px solid var(--neon-cyan);
            padding: 5px 15px;
            color: var(--neon-cyan);
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 20px;
            animation: blink 1.5s infinite;
        }

        p {
            line-height: 1.6;
            opacity: 0.8;
            font-weight: 300;
        }

        .data-stream {
            margin-top: 30px;
            font-family: monospace;
            color: var(--neon-cyan);
            font-size: 0.9rem;
            border-top: 1px dashed rgba(0, 243, 255, 0.3);
            padding-top: 20px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 未來感按鈕 */
        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: var(--neon-pink);
            color: white;
            box-shadow: 0 0 20px var(--neon-pink);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-tag">系統狀態：2045 未來協議已啟動</div>
        <h1>DEEP DATA</h1>
        <p>歡迎來到未來的網頁終端。這是一個由 AI 與數據流自動生成的空間，超越了傳統 HTML 的邊界，探索數位意識的無限可能。</p>
        
        <div class="data-stream">
            [ 關鍵字分析 ]<br>
            2045 未來網站 | 神經接口 | 實時渲染 | 量子加密
        </div>

        <button class="btn" onclick="location.reload()">同步數據流</button>
    </div>

</body>
</html>
