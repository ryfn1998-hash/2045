<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rivals - Pro Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: sans-serif; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        
        /* 賽博朋克高質感 HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between; padding: 30px;
        }
        .skew-panel {
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(8px);
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            color: #fff; padding: 12px 30px; font-weight: bold; font-size: 18px;
            letter-spacing: 2px; transform: skewX(-15deg);
        }
        .ammo-panel { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.3); }
        .ammo-text { color: #ff007f; text-shadow: 0 0 8px #ff007f; font-size: 24px; }
        
        /* 專業十字準心 */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 11;
        }
        .ch-line { position: absolute; background: #00ffff; box-shadow: 0 0 8px #00ffff; }
        .ch-h { top: 9px; left: 0; width: 20px; height: 2px; }
        .ch-v { top: 0; left: 9px; width: 2px; height: 20px; }
        .ch-dot { top: 9px; left: 9px; width: 2px; height: 2px; background: #fff; border-radius: 50%; }

        #intro {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #05050a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; z-index: 100; cursor: pointer;
        }
        #intro h1 { font-size: 48px; color: #ff007f; text-shadow: 0 0 20px #ff007f; margin-bottom: 20px; letter-spacing: 4px; }
        #intro p { color: #00ffff; font-size: 18px; text-shadow: 0 0 10px #00ffff; }
    </style>
</head>
<body>

    <div id="intro">
        <h1>NEON RIVALS : PRO</h1>
        <p>⚡ 點擊載入專業 3D 訓練場地與武器 ⚡</p>
    </div>

    <div id="hud">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="skew-panel">TRAINING ARENA v1.0</div>
            <div class="skew-panel" style="color: #ffff00; border-color: #ffff00; box-shadow: 0 0 15px rgba(255,255,0,0.3);">FPS: 流暢穩定</div>
        </div>
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: flex-end;">
            <div class="skew-panel" style="border-color: #00ff55; box-shadow: 0 0 15px rgba(0,255,85,0.3);">HP: <span style="color: #00ff55;">100</span></div>
            <div class="skew-panel ammo-panel">WEAPON: <span class="ammo-text">PLASMA RIFLE</span></div>
        </div>
    </div>

    <div id="crosshair">
        <div class="ch-line ch-h"></div>
        <div class="ch-line ch-v"></div>
        <div class="ch-dot"></div>
    </div>

    <div id="gameCanvas"></div>

    <!-- 載入 Three.js 與高階後處理與控制器擴充庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        let gunMesh; // 我們的 3D 槍肢模型
        const targets = []; // 訓練場靶子
        const particles = []; // 動態粒子陣列

        init();
        animate();

        function init() {
            // 1. 專業場景設定 (深邃冷色調)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            scene.fog = new THREE.FogExp2(0x020205, 0.015);

            // 2. 攝影機
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // 3. 環境與霓虹光源
            const ambientLight = new THREE.AmbientLight(0x0a0a15);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 40, 20);
            scene.add(dirLight);

            // 4. 第一人稱滑鼠鎖定
            controls = new THREE.PointerLockControls(camera, document.body);
            document.getElementById('intro').addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => document.getElementById('intro').style.display = 'none');
            controls.addEventListener('unlock', () => document.getElementById('intro').style.display = 'flex');
            scene.add(controls.getObject());

            // 鍵盤移動監聽
            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));
            document.addEventListener('mousedown', (e) => { if (controls.isLocked && e.button === 0) fireLaser(); });

            // 5. 🏗️ 建造「真正的」高質感賽博朋克訓練場
            buildProfessionalArena();

            // 6. 🔫 用程式碼幾何拼裝出一把「超帥科幻電漿槍」並綁定在相機前
            createAdvancedGun();

            // 7. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // 使用電影級色彩映射讓發光更自然
            document.getElementById('gameCanvas').appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function handleKey(code, isDown) {
            switch (code) {
                case 'KeyW': moveForward = isDown; break;
                case 'KeyA': moveLeft = isDown; break;
                case 'KeyS': moveBackward = isDown; break;
                case 'KeyD': moveRight = isDown; break;
            }
        }

        // ================= 🏗️ 建造合格訓練場功能 =================
        function buildProfessionalArena() {
            // 地板材質：高金屬感、低粗糙度（倒映霓虹光）
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x08080c, roughness: 0.1, metalness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 科幻發光網格
            const grid = new THREE.GridHelper(200, 80, 0xff007f, 0x111122);
            grid.position.y = 0.02;
            scene.add(grid);

            // 圍牆與巨型巨石結構 (還原 Rivals 簡約卻宏偉的場地)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x05050a, roughness: 0.4, metalness: 0.5 });
            
            // 周圍巨型科幻柱子
            for(let i=0; i<20; i++) {
                const w = Math.random() * 4 + 4;
                const h = Math.random() * 20 + 10;
                const pillarGeo = new THREE.BoxGeometry(w, h, w);
                const pillar = new THREE.Mesh(pillarGeo, wallMat);
                
                pillar.position.set(Math.random() * 140 - 70, h/2, Math.random() * 140 - 70);
                // 避開出生點
                if(pillar.position.length() < 15) pillar.position.x += 20;

                scene.add(pillar);

                // 柱子的立體發光線條
                const edges = new THREE.EdgesGeometry(pillarGeo);
                const lineMat = new THREE.LineBasicMaterial({ color: i % 2 === 0 ? 0x00ffff : #ff007f });
                const lines = new THREE.LineSegments(edges, lineMat);
                lines.position.copy(pillar.position);
                scene.add(lines);
            }

            // 放置訓練場「懸浮發光標靶」
            for (let i = 0; i < 8; i++) {
                const targetGeo = new THREE.CylinderGeometry(1.5, 1.5, 0.4, 32);
                const targetMat = new THREE.MeshStandardMaterial({ 
                    color: 0xff007f, 
                    emissive: 0xff007f, 
                    emissiveIntensity: 0.5 
                });
                const target = new THREE.Mesh(targetGeo, targetMat);
                target.rotation.x = Math.PI / 2;
                target.position.set(Math.random() * 60 - 30, Math.random() * 5 + 2, Math.random() * 60 - 40);
                scene.add(target);
                targets.push(target);
            }
        }

        // ================= 🔫 拼裝 3D 科幻槍肢模型 =================
        function createAdvancedGun() {
            // 在網頁裡無中生有建造一把精緻的複合槍枝模型
            gunMesh = new THREE.Group();

            // 槍身 (深灰色金屬)
            const bodyGeo = new THREE.BoxGeometry(0.12, 0.15, 0.7);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, metalness: 0.9, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            gunMesh.add(body);

            // 霓虹發光槍管
            const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.5, 16);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.02, -0.4);
            gunMesh.add(barrel);

            // 戰術握把
            const gripGeo = new THREE.BoxGeometry(0.08, 0.25, 0.1);
            const grip = new THREE.Mesh(gripGeo, bodyMat);
            grip.position.set(0, -0.15, 0.1);
            grip.rotation.x = -Math.PI / 6;
            gunMesh.add(grip);

            // 將槍肢掛載到攝影機下方，成為真正的主視角武器
            gunMesh.position.set(0.25, -0.28, -0.55); // 擺在畫面右下角
            camera.add(gunMesh);
        }

        // ================= ⚡ 靈魂核心：雷射射線與流暢打擊感 =================
        function fireLaser() {
            // 槍枝開槍後座力動畫
            gunMesh.position.z += 0.08;
            gunMesh.position.y += 0.02;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children);

            // 計算槍口的世界座標
            const muzzleWorldPos = new THREE.Vector3(0.25, -0.25, -0.9).applyMatrix4(camera.matrixWorld);
            let hitPoint = new THREE.Vector3();

            if (intersects.length > 0) {
                hitPoint.copy(intersects[0].point);
                
                // 如果打中訓練場懸浮標靶
                if (targets.includes(intersects[0].object)) {
                    triggerTargetHit(intersects[0].object);
                }

                // 產生高級物理粒子噴射（打擊感靈魂）
                createExplosionParticles(hitPoint, intersects[0].point);
            } else {
                hitPoint = raycaster.ray.at(100, new THREE.Vector3());
            }

            // 畫出粗度飽滿的雷射光束 (Ray)
            const laserGeo = new THREE.BufferGeometry().setFromPoints([muzzleWorldPos, hitPoint]);
            const laserMat = new THREE.LineBasicMaterial({ color: 0x00ffff });
            const laser = new THREE.Line(laserGeo, laserMat);
            scene.add(laser);

            // 0.04秒極速消失，這才是影片裡那種俐落的動態反饋
            setTimeout(() => {
                scene.remove(laser);
                laserGeo.dispose();
                laserMat.dispose();
            }, 40);
        }

        // 標靶受擊動畫
        function triggerTargetHit(obj) {
            obj.scale.set(1.4, 1.4, 1.4);
            obj.material.color.setHex(0xffffff);
            obj.material.emissive.setHex(0xffffff);
            
            setTimeout(() => {
                obj.scale.set(1, 1, 1);
                obj.material.color.setHex(0xff007f);
                obj.material.emissive.setHex(0xff007f);
                // 隨機傳送到新位置，達成「擊殺訓練」效果
                obj.position.set(Math.random() * 60 - 30, Math.random() * 5 + 2, Math.random() * 60 - 40);
            }, 120);
        }

        // 專業級粒子爆炸噴射 (純網頁刻出火花效果)
        function createExplosionParticles(pos) {
            const particleCount = 15;
            const pGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
            const pMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            for(let i=0; i<particleCount; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                
                // 給予隨機爆炸速度
                p.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.3) * 8,
                    (Math.random() - 0.5) * 8
                );
                p.userData.life = 1.0; // 壽命

                scene.add(p);
                particles.push(p);
            }
        }

        // ================= 🔄 專業遊戲循環（物理與動畫平滑化） =================
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // 槍肢後座力平滑復原
                gunMesh.position.z += ( -0.55 - gunMesh.position.z ) * 15 * delta;
                gunMesh.position.y += ( -0.28 - gunMesh.position.y ) * 15 * delta;

                // 走動時的槍肢「動態呼吸晃動感 (Weapon Bobbing)」
                if(moveForward || moveBackward || moveLeft || moveRight) {
                    const speedMultiplier = 12;
                    gunMesh.position.y += Math.sin(time * 0.01) * 0.002;
                    gunMesh.position.x += Math.cos(time * 0.005) * 0.001;
                }

                // 流暢的人物移動物理（帶有阻力減速）
                velocity.x -= velocity.x * 8.0 * delta;
                velocity.z -= velocity.z * 8.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 180.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 180.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            }

            // 更新並收回場上的粒子壽命
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.addScaledVector(p.userData.velocity, delta);
                p.userData.velocity.y -= 9.8 * delta; // 模擬重力下墜
                p.userData.life -= delta * 3.0;
                p.scale.setScalar(p.userData.life);

                if(p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // 讓標靶緩慢上下漂浮，增加訓練難度與科技感
            targets.forEach((t, index) => {
                t.position.y += Math.sin(time * 0.002 + index) * 0.005;
                t.rotation.z += 0.01; // 自轉
            });

            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
