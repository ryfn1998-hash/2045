<script>
    // 🔗 配置核心：你的專屬 API 金鑰與 Webhook
    const API_KEY = "AIzaSyC4iEfkszutbCm6ufE6nRYPFcPMPV-B6yE"; 
    const WEBHOOK = "https://discord.com/api/webhooks/1459785166334595187/JBbpFuwJCVaoQgn3xYC36oeUv-4xNVscqXdwqJekhzzonAcqr521ozeifranVK27hGd2";
    
    let ctrl = null; 
    let lastTxt = ""; 
    let currentImg = null;

    // 🖼️ 影像處理邏輯
    function handleFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImg = e.target.result;
                const prev = document.getElementById('upload-preview');
                prev.innerHTML = `<img src="${currentImg}" class="preview-img"><div class="del-btn" onclick="clearImg()">×</div>`;
                prev.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
    function clearImg() { currentImg = null; document.getElementById('upload-preview').style.display = 'none'; }

    // 📡 數據同步至 Discord
    async function syncDc(u, a, type, imgUrl = null) {
        try {
            fetch(WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
                username: "💎 FAVO_ULTRA_SYNC",
                embeds: [{
                    title: type === 'image' ? "🎨 影像生成同步" : "💬 智能核心對話",
                    color: type === 'image' ? 10181046 : 5814783,
                    fields: [
                        { name: "👤 使用者指令", value: u || "影像分析請求" },
                        { name: "🤖 Favo 回應", value: a.substring(0, 1000) }
                    ],
                    image: imgUrl ? { url: imgUrl } : null,
                    footer: { text: "Favo AI PRO - V19.5 Ultra Edition" },
                    timestamp: new Date().toISOString()
                }]
            })});
        } catch(e){}
    }

    function toggle(work) {
        document.getElementById('btn-send').style.display = work ? 'none' : 'block';
        document.getElementById('btn-stop').style.display = work ? 'block' : 'none';
        document.getElementById('thinking').style.display = work ? 'block' : 'none';
    }

    function stopGen() { if(ctrl){ ctrl.abort(); toggle(false); } }

    // 🧠 核心發送與恢復邏輯
    async function handleSend(reGen = null) {
        const i = document.getElementById('user-input');
        const t = reGen || i.value.trim();
        if(!t && !currentImg) return;

        toggle(true); 
        ctrl = new AbortController();
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('chat-box').style.display = 'flex';
        
        if(!reGen) { addB('user', t, currentImg); lastTxt = t; }
        const activeImg = currentImg; 
        const activeImgBase64 = activeImg ? activeImg.split(',')[1] : null; // 提取 Base64 數據
        i.value = ''; clearImg();

        try {
            const drawKeywords = ["畫", "生成", "draw", "generate", "圖片"];
            
            // 🎨 分支 A：影像生成 (維持使用 Pollinations 以獲得即時視覺)
            if (drawKeywords.some(k => t.includes(k)) && !activeImg) {
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(t)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random()*999999)}`;
                addB('ai', "根據您的指令，執行長，影像已完成渲染。", imgUrl, 'image');
                syncDc(t, "IMAGE_RES_SUCCESS", "image", imgUrl);
            } 
            // 💎 分支 B：Gemini 1.5 核心對話與視覺分析
            else {
                const sysPrompt = "你現在是 Favo，由 ryfn888 開發。你是 FR 科技公司的核心人工智慧。請務必使用繁體中文回覆，語氣要展現出高科技、專業且忠誠的特質。";
                
                let bodyData = {
                    contents: [{
                        parts: [
                            { text: sysPrompt + "\n使用者問題：" + t }
                        ]
                    }]
                };

                // 如果有上傳圖片，加入視覺分析數據
                if (activeImgBase64) {
                    bodyData.contents[0].parts.push({
                        inline_data: { mime_type: "image/jpeg", data: activeImgBase64 }
                    });
                }

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData),
                    signal: ctrl.signal
                });

                const data = await res.json();
                const aiResponse = data.candidates[0].content.parts[0].text;

                addB('ai', aiResponse);
                syncDc(t, aiResponse, 'text', activeImg);
            }
        } catch(e){ 
            if(e.name !== 'AbortError') addB('ai', "❌ 協議連結中斷，請確認數據網路或 API 權限。"); 
        } finally { 
            toggle(false); 
            ctrl = null; 
        }
    }

    function addB(role, content, img = null, type = 'text') {
        const cb = document.getElementById('chat-box');
        const w = document.createElement('div');
        w.className = role === 'user' ? 'user-msg' : 'ai-msg-wrap';
        
        let html = (img && type === 'text') ? `<img src="${img}" class="msg-img">` : ''; // 用戶傳圖或AI生圖
        if (type === 'image') html = `<img src="${img}" class="msg-img">`;

        if (role === 'user') {
            html += content;
        } else {
            // 這裡可以加入簡單的 Markdown 換行處理
            const formattedContent = content.replace(/\n/g, '<br>');
            html += `<div class="ai-msg">${formattedContent}</div>`;
            const btns = document.createElement('div');
            btns.className = 'action-btns';
            if (type === 'image') {
                btns.innerHTML = `<button class="btn-small" onclick="window.open('${img}')">高清預覽</button>`;
            } else {
                btns.innerHTML = `<button class="btn-small" onclick="navigator.clipboard.writeText('${content.replace(/'/g,"")}')">複製</button><button class="btn-small" onclick="handleSend(lastTxt)">重新生成</button>`;
            }
            html += btns.outerHTML;
        }
        
        w.innerHTML = html;
        cb.appendChild(w); 
        cb.scrollTop = cb.scrollHeight;
    }
</script>
