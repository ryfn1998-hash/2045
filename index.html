<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Favo AI PRO Ultra</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+TC:wght@300;500;700&display=swap');
        :root { --bg-black: #080808; --input-bg: #1a1a1a; --purple-btn: #5865f2; --accent-blue: #00f2ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; background: var(--bg-black); color: #fff; height: 100dvh; font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }

        .top-line { height: 4px; width: 100%; background: linear-gradient(90deg, transparent, #7000ff, var(--accent-blue), transparent); }
        .header { padding: 35px 0 15px 0; text-align: center; }
        .title-main { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 700; color: #58b9ff; letter-spacing: 2px; }
        
        #app { display: flex; flex-direction: column; height: 100dvh; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px 6%; display: none; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        #thinking { display: none; text-align: center; color: var(--accent-blue); font-size: 16px; padding: 15px; font-weight: bold; text-shadow: 0 0 10px rgba(0,242,255,0.6); }

        .ai-msg-wrap { display: flex; flex-direction: column; align-items: flex-start; max-width: 95%; }
        .ai-msg { background: #222; padding: 18px 24px; border-radius: 20px; font-size: 18px; line-height: 1.8; border: 1px solid #333; width: 100%; white-space: pre-wrap; color: #efefef; }
        .user-msg { background: #3a4150; align-self: flex-end; padding: 16px 22px; border-radius: 22px; font-size: 18px; max-width: 88%; word-break: break-all; border: 1px solid #4a5260; }
        .msg-img { max-width: 100%; border-radius: 12px; margin-bottom: 8px; border: 2px solid var(--accent-blue); }
        
        .footer { padding: 20px 5% calc(35px + env(safe-area-inset-bottom)); background: #0a0a0a; border-top: 1px solid #222; }
        #upload-preview { display: none; margin-bottom: 20px; position: relative; }
        .preview-img { height: 100px; width: 100px; border-radius: 15px; border: 3px solid var(--accent-blue); object-fit: cover; }
        .del-btn { position: absolute; top: -15px; left: 85px; background: #ff3b3b; color: #fff; border-radius: 50%; width: 35px; height: 35px; text-align: center; line-height: 32px; cursor: pointer; font-weight: 900; font-size: 22px; border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,0,0,0.5); }

        .input-bar { background: var(--input-bg); border-radius: 45px; display: flex; align-items: center; padding: 12px 12px 12px 25px; border: 2px solid #3a3a3a; min-height: 75px; }
        .plus-icon { color: #fff; font-size: 40px; margin-right: 18px; cursor: pointer; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; background: #333; border-radius: 50%; }
        
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 20px; }
        .send-btn { background: var(--purple-btn); color: #fff; border: none; padding: 15px 35px; border-radius: 35px; font-weight: 700; cursor: pointer; font-size: 18px; }
        .stop-btn { background: #cc3333; color: #fff; border: none; padding: 15px 35px; border-radius: 35px; font-weight: 700; display: none; font-size: 18px; }

        #welcome-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 10%; }
        .welcome-text { font-size: 36px; font-weight: 700; line-height: 1.5; }
        .favo-hl { color: var(--accent-blue); }
    </style>
</head>
<body>

<div id="app">
    <div class="top-line"></div>
    <div class="header"><div class="title-main">FAVO AI PRO</div></div>
    
    <div id="welcome-screen">
        <div class="welcome-text">您好！我是 <span class="favo-hl">Favo</span><br>有什麼我可以幫您的？</div>
    </div>

    <div id="chat-box" class="chat-container"></div>
    <div id="thinking">🌐 正在存取數據鏈路...</div>

    <div class="footer">
        <div id="upload-preview"></div>
        <div class="input-bar">
            <label for="file-input" class="plus-icon">+</label>
            <input type="file" id="file-input" style="display:none;" onchange="handleFile(this)" accept="image/*">
            <input type="text" id="user-input" placeholder="輸入訊息或上傳圖片..." onkeydown="if(event.key==='Enter') handleSend()">
            <button id="btn-send" class="send-btn" onclick="handleSend()">傳送</button>
            <button id="btn-stop" class="stop-btn" onclick="stopGen()">暫停</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ 請確保此 Key 在 Google AI Studio 已啟用
    const API_KEY = "AIzaSyC4iEfkszutbCm6ufE6nRYPFcPMPV-B6yE"; 
    
    let chatHistory = []; 
    let ctrl = null; 
    let currentImg = null;

    function handleFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentImg = e.target.result;
                const prev = document.getElementById('upload-preview');
                prev.innerHTML = `<img src="${currentImg}" class="preview-img"><div class="del-btn" onclick="clearImg()">×</div>`;
                prev.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function clearImg() { 
        currentImg = null; 
        document.getElementById('upload-preview').style.display = 'none'; 
        document.getElementById('file-input').value = "";
    }

    function toggle(work) {
        document.getElementById('btn-send').style.display = work ? 'none' : 'block';
        document.getElementById('btn-stop').style.display = work ? 'block' : 'none';
        document.getElementById('thinking').style.display = work ? 'block' : 'none';
    }

    function stopGen() { if(ctrl){ ctrl.abort(); toggle(false); } }

    async function handleSend() {
        const iEl = document.getElementById('user-input');
        const text = iEl.value.trim();
        if(!text && !currentImg) return;

        toggle(true); 
        ctrl = new AbortController();
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('chat-box').style.display = 'flex';
        
        addB('user', text, currentImg);
        const activeImg = currentImg; 
        iEl.value = ''; clearImg();

        try {
            let userParts = [{ text: text }];
            if (activeImg) {
                userParts.push({ inline_data: { mime_type: "image/jpeg", data: activeImg.split(',')[1] } });
            }
            chatHistory.push({ role: "user", parts: userParts });
            if(chatHistory.length > 20) chatHistory.shift();

            // 🚀 關鍵修復：改用 v1beta 並將 Key 放在 URL 參數中，避免 Header 攔截導致的 404
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            const response = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    contents: chatHistory,
                    tools: [{ google_search_retrieval: {} }],
                    system_instruction: { parts: [{ text: "你是 Favo，一個強大的通用 AI 助理。請真實分析圖片，必要時聯網搜尋。請使用繁體中文。" }] }
                }),
                signal: ctrl.signal
            });

            const result = await response.json();

            if (!response.ok) {
                // 如果後台報錯，抓取具體訊息
                throw new Error(result.error ? result.error.message : "Network Fail");
            }

            const aiTxt = result.candidates[0].content.parts[0].text;
            chatHistory.push({ role: "model", parts: [{ text: aiTxt }] });
            addB('ai', aiTxt);

        } catch(e){ 
            if(e.name !== 'AbortError') {
                console.error("Favo 鏈路錯誤:", e);
                addB('ai', "❌ 核心連線失調。這通常是 API Key 尚未生效或區域網路限制，請稍後重試。");
            }
        } finally { toggle(false); ctrl = null; }
    }

    function addB(role, content, img = null) {
        const cb = document.getElementById('chat-box');
        const w = document.createElement('div');
        w.className = role === 'user' ? 'user-msg' : 'ai-msg-wrap';
        let html = (img) ? `<img src="${img}" class="msg-img">` : '';
        if (role === 'user') {
            html += content || (img ? "[圖片數據]" : "");
        } else {
            html += `<div class="ai-msg">${content}</div>`;
        }
        w.innerHTML = html;
        cb.appendChild(w); 
        cb.scrollTop = cb.scrollHeight;
    }
</script>
</body>
</html>
